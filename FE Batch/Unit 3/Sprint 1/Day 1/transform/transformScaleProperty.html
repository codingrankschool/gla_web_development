<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Transform Scale Property Example</title>

    <style>

        #box{
            width: 200px;
            height: 200px;
            border: 4px solid;
            margin: 200px auto;
            transition: all 2s;
        }

        #box:hover{
            transform: scale(.5) rotate(-360deg);
            border: 2px solid yellow;
        }

    </style>

</head>
<body>

    <div id="box"></div>
    
</body>
</html>

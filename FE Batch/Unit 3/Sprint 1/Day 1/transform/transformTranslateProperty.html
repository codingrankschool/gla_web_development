<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Transform translate property</title>
    <style>

        #box{
            width: 200px;
            height: 200px;
            border: 2px solid;
            transition: all 2s;
        }

        #box:hover{
            transform: translate(300px, 300px) rotate(360deg);
            background-color: red;
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <div id="box">

    </div>
    
</body>
</html>

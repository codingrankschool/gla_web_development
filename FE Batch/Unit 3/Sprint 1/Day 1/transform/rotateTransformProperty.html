<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Transform Rotate</title>
    
    <style>

        #box{
            margin: 200px auto;
            width: 200px;
            height: 200px;
            border: 4px solid red;
            border-bottom: 4px dotted green;
            transition: all 2s;

        }

        #box:hover{
            transform: rotate(360deg);
            background-color: yellow;
            border-radius: 20px 90px 10px 30px;
        }

    </style>


</head>
<body>

    <div id="box">

    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Transform Skew Property</title>

    <style>

        #box{
            width: 200px;
            height: 200px;
            border: 2px solid red;
            margin: 400px auto;
            transition: transform 2s;
        }

        #box:hover{
            transform: skewX(85deg);
        }

    </style>

</head>
<body>

    <div id="box"></div>
    
</body>
</html>

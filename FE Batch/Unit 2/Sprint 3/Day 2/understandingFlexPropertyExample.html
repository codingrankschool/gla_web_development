<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding Flex Property</title>

    <style>

        #container{
            border: 1px solid red;
            padding: 10px;
            display: flex;
            justify-content: center;
            
        }

        #container>div{
            border: 1px solid green;
        }

    </style>

</head>
<body>

    <div id="container">
        <div>Box-1</div>
        <div>Box-2</div>
        <div>Box-3</div>
        <div>Box-4</div>
        <div>Box-5</div>
    </div>
    
</body>
</html>


<!-- 
Once you use display:flex, then after this you're eligible to use flex parent and child property:

<div id="container">
        <div>Box-1</div>
        <div>Box-2</div>
        <div>Box-3</div>
        <div>Box-4</div>
        <div>Box-5</div>
</div>

Div as container - parent
box1 to box 5 - childs

Flex parent properties:
flex-direction
justify-content
align-items
align-content
flex-wrap


Child properties:
flex-shrink
flex-grow
order
flex-basis


To use all of above parent and child properties make sure to use display as flex.

-->

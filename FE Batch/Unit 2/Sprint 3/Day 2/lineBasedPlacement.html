<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding Line Based Placement</title>

    <style>

        #container{
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            grid-template-areas:
            "rd rd rd"
            "ylw purpl purpl"
            "ylw cyn cyn"
            ;
        }

        #container>div:nth-child(1){
            background-color: red;
            /* grid-area: rowStarting/columnStarting/rowEnding/ColumnEnding; */
            /* grid-area: 1/1/2/3; */
            grid-area: rd;
        }
        
        #container>div:nth-child(2){
            background-color: teal;
            /* grid-area: 1/3/4/4; */
            grid-area: tl;
        }
        
        #container>div:nth-child(3){
            background-color: cyan;
            /* grid-area: 2/1/4/3; */
            grid-area: cyn;
        }
        
        #container>div:nth-child(4){
            background-color: yellow;
            grid-area: ylw;
        }
        
        #container>div:nth-child(5){
            background-color: purple;
            grid-area: purpl;
        }
        
        #container>div:nth-child(6){
            background-color: pink;
            grid-area: pnk;
        }

    </style>

</head>
<body>

    <div id="container">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding without flex property</title>

    <style>

        #container{
            border: 1px solid red;
            padding: 10px;
        }

        #container>div{
            border: 1px solid green;
            display: inline-block;
        }

        #container>div:nth-child(2), #container>div:nth-child(3){
            margin-left: 50px;
        }


    </style>

</head>
<body>
    <div id="container">
        <div>Box-1</div>
        <div>Box-2</div>
        <div>Box-3</div>
        <div>Box-4</div>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding INLINE CSS</title>
</head>
<body>

    <!-- 
    INLINE CSS: Way of styling where we use css one by one or element by element for styling particular html element.


    Example:

    <h1> I'm heading one </h1>
    <p> I'm paragraph </p>

    If want to give style to above html element then using inline css we can give to particular element in that line itself.

    FYI:
    HTML: Collection of html elemnts/markup tags(high level understanding) to structure web page
    Examples: text/link/table/form/other elements

    CSS:  Collection of css properties to make particular html element beautiful/styling.
    Examples: color/backgroud-color/text-align/margin/padding/border/other properties.


    Using these css properties you can style particular html element line by line or element by element this type of styling is known as inline style.

    Example:
    <h1> I'm heading one </h1>
    <p> I'm paragraph </p>

    How can you apply particular css property to particular html element? = style attribute => it is commnon attribute for all the html elements for giving inline style.


    <h1 style="property1:itsvalue;property2:itsvalue;"> I'm heading one </h1>
    Example:
    <h1 style="color:red"> I'm heading one </h1>
    <p style="background-color:teal;color:white"> I'm paragraph </p>
    -->

    <h1 style="color:red"> I'm heading one </h1>
    <p style="background-color:teal;color:white"> I'm paragraph </p>
    
</body>
</html>

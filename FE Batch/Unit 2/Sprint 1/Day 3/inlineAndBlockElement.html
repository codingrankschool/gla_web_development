<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding Inline and Block Elements</title>
</head>
<body>

    <!-- In HTML, All its elements are categorized into two parts:
    1. Block Elements: They block the entire line(full width of screen)
    Other Terms: start on a new line and take full width

    Examples: div>, <p>, <h1>–<h6>, <ul>, <ol>, <li>, <section>, <article>, <header>, <footer>, <nav>, <main>, <table>, <form>.


    2. Inline Elements: They block till their content presence
    Other Terms: flow within text
    Examples: <a>, <img>, <span>, <b>, <i>, <strong>, <em>, <code>, <input>, button.
    -->
    

    <!-- block element -->
     <!-- <h2 style="background-color: red;">I'm heading two</h2> -->

     <!-- inline element -->
      <!-- <span style="background-color: teal;">I'm span</span>
      <button style="background-color: red;">Click</button>
      <p>I'm paragraph</p> -->


      <!-- How to make?
      Inline to Block element?
      Block to Inline Element?
      
      display property:
      inline
      block
      inline-block
      -->

      <!-- <p style="background-color: red;display: inline;">I'm paragraph</p>
      <span style="background-color: #ffff00;display: block;">I'm span</span> -->


      <!-- How to create box?
      Requirement:
      Material/Element: div/span
      height: css height property
      width: css width property 

      visualization: inspecting/background-color/border
      -->

      <div style="
      width: 100px;
      height: 100px;
      background-color: red;
      text-align: center;
      color: white;
      display: inline-block;
      ">

      <span>Box 1</span>

      </div>

      <div style="
      width: 100px;
      height: 100px;

      display: inline-block;
      ">

      </div>

</body>
</html>

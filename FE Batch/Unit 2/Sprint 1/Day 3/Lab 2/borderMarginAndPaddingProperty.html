<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding Border, Padding and Margin Example</title>
</head>
<body style="margin: 0;">

    <!-- how to create box?
    element: div
    width:
    height 
    visulization: border/background-color

    border: It creates a thickness of pixel around the element.

    syntax:
    border: thickness(px) type(dotted/dashed/solid) color(default - black, other colors as well)

    border-top: 1px solid red;
    border-right: 2px dotted teal;
    border-bottom: 3px solid tomato;
    border-left: 1px solid;

    All side same border:
    border: 1px solid red;
    -->

    <!-- <div style="
    width: 100px;
    height: 100px;
    /* background-color: red; */
    /* border-top: 1px solid red;
    border-right: 2px dotted teal;
    border-bottom: 3px dashed tomato;
    border-left: 1px solid; */
    border: 1px solid red;
    "
    >
        Box 1
    </div> -->

    <!-- margin property
    - Space outside the border 

    syntax:
    margin: space in px;

    How to do that:
    margin-top: 10px;
    margin-right: 20px;
    margin-bottom: 30px;
    margin-left: 40px;

    shorthand way:
    margin: top right bottom left;
    margin: 10px 20px 30px 40px;

    Same margin allside:
    margin: 10px;

    Same margin on left-right and same on top bottom:
    margin: top-bottom left-right;
    margin: 10px 20px;
    -->


    <!-- padding property
    - Space between content and border 

    syntax:
    padding: space in px;

    How to do that:
    padding-top: 10px;
    padding-right: 20px;
    padding-bottom: 30px;
    padding-left: 40px;

    shorthand way:
    padding: top right bottom left;
    padding: 10px 20px 30px 40px;

    Same margin allside:
    padding: 10px;

    Same padding on left-right and same on top bottom:
    padding: top-bottom left-right;
    padding: 10px 20px;
    -->
    <div style="
    width: 100px;
    height: 100px;
    border: 1px solid red;
    margin: 20px;
    padding: 10px;
    
    "
    >
        Box 1
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding Inline and Block Element</title>
</head>
<body>

    <!-- In HTML, All its elements are categorized into two parts
    
    1. Block Elements: They block entire line
    Other terms: start on a new line and take full width.
    Exmaple: <div>, <p>, <h1>–<h6>, <ul>, <ol>, <li>, <section>, <article>, <header>, <footer>, <nav>, <main>, <table>, <form>.

    2. Inline Elements: They block line till their content presence.
    Other terms: flow within text
    Examples: <a>, <img>, <span>, <b>, <i>, <strong>, <em>, <code> input, button.
    -->
    
    <!-- block element -->
     <!-- <h2 style="background-color: red;">Heading Two</h2> -->

     <!-- Inline Element -->
      <!-- <span style="background-color: teal;">I'm span</span>
      <button>Click</button>
      <p>I'm para</p>

      <hr> -->

      <!-- How to make?
      Inline to Block Element
      Block to Inline Element
      
      Solution: display property
      values:
      inline
      block
      -->

      <!-- <h2 style="background-color: red;display: inline;">Heading Two</h2>

      <span style="background-color: yellow;display: block;">I'm span</span> -->


      <!-- How to create box/container on web page
       HTML ELEMENT: div/span
       height: css property height
       width: css property width
       visulization: background-color/border/inspecting
      -->

      <div style="width: 100px;height:100px;background-color: red;text-align: center;color: black; display: inline-block;">
        <span>Box 1</span>

      </div>

      <div style="width: 100px;height: 100px;background-color: red;text-align: center;color: black;display: inline-block;">
        <span>Box 2</span>

      </div>

      <div style="width: 100px;height: 100px;background-color: red;text-align: center;color: black;display: inline-block;">
        <span>Box 3</span>

      </div>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Internal CSS - Selectors</title>

    <style>

        /* Tag/element selector */

        h1, p{
            background-color: red;
            color: white;
            padding: 10px;
            margin: 0px;
        }

        p{
            margin: 10px;
            background-color: yellow;
            color: black;
        }

        input{
            padding: 10px 20px;
            width: 300px;
            margin: 10px;
            font-size: 20px;
        }

        /* type/attribute selector */
        input[type="email"]{
            background-color: yellow;
        }

    </style>
</head>
<body>

    <h1>Hello Everyone</h1>
    <p>Welcome GLA University</p>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Iure veritatis perspiciatis nulla earum, est et a possimus rerum fugit velit sint. Eos, pariatur fugiat exercitationem facilis fugit repellendus. Sed, saepe.</p>

    <hr>
    <input type="text" placeholder="Enter Name">
    <br>
    <input type="email" placeholder="Enter Email">
    <br>
    <input type="email" placeholder="Enter Email">

    
</body>
</html>

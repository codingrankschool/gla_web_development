<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understading Tag and Type selector</title>

    <!-- internal css -->
    <style>

        /* tag/element selector */

        h1{
            background-color: red;
            color: white;
            padding: 10px;
            margin: 0;
        }

        p{
            background-color: yellow;
            padding: 20px;
            margin: 0;
        }

        a{
            font-size: 30px;
            text-decoration: none;
        }

        /* type/attribute selector  */

        a[href="https://google.com"]{
            color: red;
        }

        input[type="email"]{
            background-color: red;
        }


    </style>

</head>
<body>

    <h1>GLA University</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Iure delectus atque consectetur doloribus mollitia ea eos odit quo vitae iusto pariatur, praesentium eligendi. Asperiores quis quae omnis accusamus illo voluptatem.</p>

    <hr>
    <a href="https://google.com">Google</a>
    <br>
    <a href="https://flipkart.com">Flipkart</a>
    <br>
    <input type="text" placeholder="Enter Name">
    <br>
    <input type="email" placeholder="Enter Email">
    
</body>
</html>

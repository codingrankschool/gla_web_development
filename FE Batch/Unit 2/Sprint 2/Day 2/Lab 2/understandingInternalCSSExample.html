    Example:

    <h1>Make me red background and white as color</h1>

    How to select above h1 element from style element exists inside head element to give style?
    Solution: CSS Selectors
    - Using css selectors we select particular html element for styling and this way of stylinng is called as internal and external styling.

    There are following selectors
    1. tag/type/element selector
    2. id
    3. class

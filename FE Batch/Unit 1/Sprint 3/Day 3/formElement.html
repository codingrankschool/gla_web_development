<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding Form Element</title>
</head>
<body>

    <!-- 
    Form: We use form to take input/data from users
    Note: Form is collection of input boxes(input element).
    Input Element => to take input from the user
    -->

    <form>

        <input type="hidden" placeholder="Enter Name" required>
        <input type="email" placeholder="Enter Email" required readonly>
        <input type="password" placeholder="Enter Password" required>
        <br>

        <input type="submit">
        <!-- <input type="button" value="Submit"> -->
         <!-- <button>Submit</button> -->

    </form>
    
</body>
</html>

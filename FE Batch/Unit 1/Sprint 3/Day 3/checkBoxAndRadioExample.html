<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding checkbox and radio</title>
</head>
<body>

    <!-- 
    checkbox: for multiple selection 
    Examples: Select Your Skills
    radio: for single selection
    Example: Select Gender
    -->


    <!-- <p>Enter Name: </p>
    <input type="text">

    <p>Enter Email:</p>
    <input type="email"> -->

    <!-- recommended choice rather than p and other element for input box
    label 
    -->

    <!-- <label for="name">Enter Name: </label>
    <input name="name" type="text">

    <label for="email">Enter Email: </label>
    <input name="email" type="email"> -->

    <!-- radio type input box -->

    <label for="gender">Select Gender: </label>
    
    <input name="gender" type="radio">
    <label for="male">Male</label>

    <input name="gender" type="radio">
    <label for="female">Female</label>


    <!-- radio type input box -->

    <label for="skills">Select Skills: </label>
    
    <input name="skill" type="checkbox">
    <label for="java">Java</label>

    <input name="skill" type="checkbox">
    <label for="javascript">Javascript</label>

    <input name="skill" type="checkbox">
    <label for="python">Python</label>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding Table Element Example</title>
</head>
<body>

    <!-- Table:
    Table element is used to present data in tabular format(rows and columns) 

    table = html
    thead = head
    tbody = body
    -->

    <!-- table attribute:
    border: 1    
    cellpadding: gives space around the cell
    cellspacing:
    bgcolor:
    -->

    <table border="1" cellpadding="5px" cellspacing="10px"
    bgcolor="red"
    >

    <caption>Student Details</caption>

        <thead bgcolor="yellow">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Address</th>
            </tr>
        </thead>


        <tbody bgcolor="white">

            <!-- row 1 for data -->
            <tr>

                <td>Rakesh Kumar</td>
                <td>rakesh@gmail.com</td>
                <td>Noida</td>

            </tr>

            <tr>

                <td>Rakesh Kumar</td>
                <td>rakesh@gmail.com</td>
                <td>Noida</td>

            </tr>

            <tr>

                <td>Rakesh Kumar</td>
                <td>rakesh@gmail.com</td>
                <td>Noida</td>

            </tr>

            <tr>

                <td>Rakesh Kumar</td>
                <td>rakesh@gmail.com</td>
                <td>Noida</td>

            </tr>

        </tbody>


    </table>
    
</body>
</html>

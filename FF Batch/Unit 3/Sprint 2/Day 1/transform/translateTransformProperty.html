<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Translate Transform Property</title>
    <style>

        #box{
            width: 150px;
            height: 150px;
            border: 2px dotted;
            border-bottom: 2px solid red;
            transition: transform 1s;
        }

        #box:hover{
            transform: translate(100px, 200px) rotate(180deg) scale(.5);
        }

    </style>
</head>
<body>

    <div id="box"></div>
    
</body>
</html>

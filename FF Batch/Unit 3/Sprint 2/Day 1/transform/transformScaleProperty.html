<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Scale Transform Property</title>
    <style>

        #box{
            width: 150px;
            height: 150px;
            border: 2px dotted;
            margin:170px auto;
            border-bottom: 2px solid red;
            transition: all 1s;
        }

        #box:hover{
            transform: scale(.5) rotate(360deg);
            border-radius: 50%;
        }

    </style>
</head>
<body>

    <div id="box"></div>
    
</body>
</html>

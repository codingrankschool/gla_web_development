<!doctype html>
<html lang="en">
  <head>
    <title>Understanding general sibling selector(~)</title>
    <style>

        #container>p~p{
            background-color: red;
        }

        /* #container>div>div~p{
            background-color: tomato;
        } */
            
    </style>
  </head>
  <body>
    <div id="container">
        <p>I'm paragraph - 1</p>
        <p>I'm paragraph - 2</p>
        <p>I'm paragraph - 3</p>

        <div>
            <div>
                <div>
                    <p>I'm special paragram</p>
                </div>
            </div>
            <p>I'm not special paragraph</p>
        </div>
        <div>
            <div>
            <p>I'm paragraph - 1</p>
            <p>I'm paragraph - 2</p>
            <p>I'm paragraph - 3</p>
            </div>
        </div>
        <div>
            <p>I'm paragraph - 1</p>
            <p>I'm paragraph - 2</p>
            <p>I'm paragraph - 3</p>
        </div>

        <h2>I'm heading two</h2>

    </div>
    <p>I'm super special paragraph</p>
  </body>
</html>

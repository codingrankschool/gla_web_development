<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding id and class selector</title>

    <style>

        #csk-team{
            background-color: red;
            padding: 10px;
        }

        .csk-player{
            background-color: yellow;
            padding: 10px;
            margin: 5px;
        }

         #mi-team{
            background-color: yellow;
            padding: 10px;
        }

        .mi-player{
            background-color: blue;
            padding: 10px;
            margin: 5px;
            color: white;
        }

    </style>

</head>
<body>

    <!-- id:
    It is always unique
    When you wanna give unique style or particular style to specific html element.
    
    syntax:
    #id-name

    class: It is always common
    When you wanna give common style to html elements.

    syntax:
    .class-name
    -->
    

    <div id="csk-team">
        <div class="csk-player">csk-player-1</div>
        <div class="csk-player">csk-player-2</div>
        <div class="csk-player">csk-player-3</div>
        <div class="csk-player">csk-player-4</div>
        <div class="csk-player">csk-player-5</div>
    </div>

    <hr>

    <div id="mi-team">
        <div class="mi-player">mi-player-1</div>
        <div class="mi-player">mi-player-2</div>
        <div class="mi-player">mi-player-3</div>
        <div class="mi-player">mi-player-4</div>
        <div class="mi-player">mi-player-5</div>
    </div>

    <hr>

    <div id="rcb-team">
        <div class="rcb-player">rcb-player-1</div>
        <div class="rcb-player">rcb-player-2</div>
        <div class="rcb-player">rcb-player-3</div>
        <div class="rcb-player">rcb-player-4</div>
        <div class="rcb-player">rcb-player-5</div>
    </div>



</body>
</html>

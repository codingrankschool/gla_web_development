<!DOCTYPE html>
<html lang="en">
<head>
    <title>More about box model</title>
</head>
<body>

    <div style="width: 100px;height: 100px;border: 1px solid red; padding: 10px;box-sizing: border-box;">

    </div>
    
</body>
</html>

<!-- 
Note: On adding padding and border to particular element then its height and width increases.

Why: becuase there is box-sizzing property its value is default content-box

How to stop this
box-sizzing: border-box

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Inline CSS</title>
</head>
<body>

    <!-- 

     Note:
     HTML: Collections of html elements/markup tags
     Example: heading elements, image/table/list and others
     CSS: Collection of css properties
     Example: color, backgroudColor, textAlign, other properties.
    
     Inline CSS: It a way of styling where we style particular html element line by line or element by element

     Note: It is being written inside html file itself

     Example:
     <h1> I'm heading one </h1>

     Common attributes among all the html element: style attribute
     With the help of style attribute we can style particular html element in inlice css.

     <h1 style="cssPropertyName:cssPropertyValue"> I'm heading one </h1>
     <h1 style="color:white;backgroundColor:red"> I'm heading one </h1>
     <p style="color:teal">I'm paragraph</p>
    
    -->

    <h1 style="color:white;background-color:red"> I'm heading one </h1>
    <p style="color:teal">I'm paragraph</p>
    <img style="width: 200px;height: 200px;" src="./image.png" alt="Nature image">
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Revising Margin And Padding</title>
</head>
<body>

    <!-- 
    margin:
    - space outside border or element.
    padding:
    - space between content and border(space within element).
    -->

    <div style="
    width: 100px;
    height: 100px;
    border: 1px solid red;
    margin: 10px 20px;
    padding-left: 20px;
    ">

    <p>Paragraph</p>
    <h3>Heading</h3>

    </div>
    
    
</body>
</html>

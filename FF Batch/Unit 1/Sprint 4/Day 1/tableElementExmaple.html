<!DOCTYPE html>
<html lang="en">
<head>
    <title>Understanding Table Element</title>
</head>
<body>

    <!-- Table Element:
    - To Represent the data in the tabular format(rows/horizontally/y-axis and columns/vartically/x-axis)
    
    
    HTML == Table
    head == thead
    body == tbody


    Table element attributes:
    border
    cellpadding: around the cell/grid - it creates space
    cellspacing: outside the cell/grid - it creates space
    bgcolor: to decide background color


    table column attribute:
    rowspan
    colspan
    -->

    <table border="1" cellpadding="10px" cellspacing="10px" bgcolor="red">

        <caption>Student Table</caption>

        <thead bgcolor="yellow">

            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
            </tr>

        </thead>

        <tbody bgcolor="white">

            <!-- first row -->
            <tr>
                <td>Rakesh Kumar</td>
                <td>rakesh@gmail.com</td>
                <td>Noida</td>
            </tr>

            <tr>
                <td>Sindhu</td>
                <td>sindhu@gmail.com</td>
                <td>Hyderabad</td>
            </tr>

            <tr>
                <td>Hitesh Kumar</td>
                <td>hitesh@gmail.com</td>
                <td>Delhi</td>
            </tr>

        </tbody>


    </table>
    
</body>
</html>

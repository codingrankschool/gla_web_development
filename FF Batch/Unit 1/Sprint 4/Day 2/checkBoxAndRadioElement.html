<!DOCTYPE html>
<html lang="en">
<head>
    <title>Radio and Checkbox Example</title>
</head>
<body>

    <!--
    checkbox: to select multiple options
    radio: to select single option
    -->
    <!-- <input type="radio">
    <input type="checkbox"> -->


    <!-- <p>Enter Name:</p>
    <input type="text">
    <br>
    <p>Enter Email:</p>
    <input type="email"> -->

    <!-- <label for="name">Enter Name:</label>
    <input type="text">
    <br>
    <label for="email">Enter Email:</label>
    <input type="email"> -->


    <!-- radio good example -->
    <label for="gender">Select Gender:</label>

    <label for="male">Male</label>
    <input name="gender" type="radio">

    <label for="female">Female</label>
    <input name="gender" type="radio">

    <!-- checkbox good example -->

    <br>

    <label for="skills">Select Skill:</label>

    <label for="java">Java</label>
    <input name="skill" type="checkbox">

    <label for="python">Python</label>
    <input name="skill" type="checkbox">

     <label for="javascript">Javascript</label>
    <input name="skill" type="checkbox">
    
</body>
</html>

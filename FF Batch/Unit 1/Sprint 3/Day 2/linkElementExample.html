<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Understanding Link(Anchor) Element</title>
</head>
<body>

    <!-- Link(Anchor):
    - To create hypertext(clickable text) on your webpage.
    - element - a 

    Note: hypertext(clickable text) - it contains/has some resource(image, other page, document, other webpage) link
    -->
    <!-- link to google.com -->
    <a href="https://google.com">Link</a>
    <hr>
    <!-- link to other html page -->
    <a href="./blogPage.html">Other HTML Page</a>
    <hr>
    <!-- link to document -->
    <a href="./Lab Problems (2).pdf">Document</a>

    <hr>
    <!-- link to image -->
    <a href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5lKCZOFc_9AzpNWYYsEEpFALUc6J5zg0QlFIlgnc3Aw&s=10">Image</a>


    
</body>
</html>

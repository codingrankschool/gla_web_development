    var clickBtns = document.querySelectorAll(".count-btn")
    var resultBox = document.querySelector("#result")

    // console.log(clickBtns)
    for(var i=0;i<clickBtns.length;i++){
        clickBtns[i].addEventListener("click", clickHandler)
    }

    var count = 0
    function clickHandler(){
        //event object: its being shared to all the html element when we add any event to it.
        console.log(event)
        //this event object tells you two important thing:
        //1. type: what type of event - click
        //2. target: to which element you've added event - btn

        var sign = event.target.innerText
        if(sign == "+"){
            count++
        }else{
            count--
        }

        resultBox.innerText = count
    }

</script>
